name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build all
        run: npm run build

      # ── Витрина 1: GitHub-профиль → iMironRU/iMironRU ──────────────────────
      - name: Deploy github-profile README
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: dist/github-profile
          destination-github-username: iMironRU
          destination-repository-name: iMironRU
          target-branch: main
          commit-message: 'chore: rebuild profile from imiron-brand [${{ github.sha }}]'

      # ── Витрина 2: резюме → Pages этого репозитория ─────────────────────────
      - name: Deploy resume to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/resume
          destination_dir: resume
          keep_files: true
          commit_message: 'chore: rebuild resume from imiron-brand [${{ github.sha }}]'
