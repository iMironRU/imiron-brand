name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build all
        run: npm run build

      # ── Витрина 1: GitHub-профиль → iMironRU/iMironRU ──────────────────────
      - name: Deploy github-profile README
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: dist/github-profile
          destination-github-username: iMironRU
          destination-repository-name: iMironRU
          target-branch: main
          commit-message: 'chore: rebuild profile from imiron-brand [${{ github.sha }}]'

      # ── Витрина 2: imiron.ru лендинг → iMironRU/imironru.github.io (корень) ──
      - name: Deploy imiron.ru landing
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: dist/site
          destination-github-username: iMironRU
          destination-repository-name: imironru.github.io
          target-branch: main
          commit-message: 'chore: rebuild landing from imiron-brand [${{ github.sha }}]'

      # ── Витрина 2б: portfolio → iMironRU/imironru.github.io/portfolio ────────
      - name: Deploy portfolio page
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: dist/github-pages
          destination-github-username: iMironRU
          destination-repository-name: imironru.github.io
          target-directory: portfolio
          target-branch: main
          commit-message: 'chore: rebuild portfolio from imiron-brand [${{ github.sha }}]'

      # ── Витрина 3: app → iMironRU/imironru.github.io/app ───────────────────
      - name: Deploy app site
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: dist/app
          destination-github-username: iMironRU
          destination-repository-name: imironru.github.io
          target-directory: app
          target-branch: main
          commit-message: 'chore: rebuild app from imiron-brand [${{ github.sha }}]'

      # ── Витрина 4: book → iMironRU/imironru.github.io/book ──────────────────
      - name: Deploy book site
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: dist/book
          destination-github-username: iMironRU
          destination-repository-name: imironru.github.io
          target-directory: book
          target-branch: main
          commit-message: 'chore: rebuild book from imiron-brand [${{ github.sha }}]'

      # ── Витрина 5: резюме → Pages этого репозитория ─────────────────────────
      - name: Deploy resume to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/resume
          destination_dir: resume
          keep_files: true
          commit_message: 'chore: rebuild resume from imiron-brand [${{ github.sha }}]'
